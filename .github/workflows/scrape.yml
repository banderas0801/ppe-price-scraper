name: Scrape PPE Prices
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium
      - name: Run scraper
        run: python scraper/scrape_playwright.py data/prices.json
      - name: Run validator
        run: python scraper/validate.py data/prices.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "update prices $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
